<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --midnight: #1A2332; --compliance: #2F6B4A; --parchment: #F5F3EE; --warm-grey: #D8D4CC; --slate: #3A4452;
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'DM Sans', system-ui, -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Rendered at 2x (1200x400) for a 600x200 slot in the email */
  body { width: 1200px; height: 400px; background: var(--midnight); color: var(--parchment); font-family: var(--sans); overflow: hidden; padding: 56px 80px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 48px; }
  .wordmark { font-family: var(--serif); font-size: 40px; }
  .wordmark em { color: #5FA37C; }
  .tag { font-size: 22px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--warm-grey); }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 80px; line-height: 1.08; }
  h1 em { color: var(--warm-grey); }
</style>
</head>
<body>
  <div class="top">
    <div class="wordmark">Trace<em>Desk</em></div>
    <div class="tag">SyncBridge &middot; On your Scale plan</div>
  </div>
  <h1>Your ERP and TraceDesk,<br><em>telling the same story.</em></h1>
</body>
</html>
